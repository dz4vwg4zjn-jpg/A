<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#fff5e8"><title>英文多益考題</title><style>*{box-sizing:border-box}body{margin:0;background:#fff5e8;color:#493c38;font:17px/1.6 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:600px;margin:auto;padding: max(24px,env(safe-area-inset-top)) 18px 40px}h1{font-size:27px;margin:0}small{color:#78665d}article{background:white;border:1px solid #f0ded0;border-radius:24px;padding:20px;margin:16px 0;box-shadow:0 5px 15px #a66b3610}button{font:inherit;color:inherit;cursor:pointer;border:1px solid #e8d6c7;background:white;border-radius:15px;padding:13px;width:100%;margin:5px 0;text-align:left;min-height:48px}button.sel{background:#fbdcc8;border:2px solid #b86a48}button.primary{background:#a94f36;color:white;text-align:center;border:0;font-weight:bold}button:disabled{opacity:.4}progress{width:100%;accent-color:#b86a48;height:12px} .good{color:#28734b}.bad{color:#a33b39} .row{display:flex;gap:10px}.row button{text-align:center}h2{font-size:21px}p{margin:10px 0} .score{font-size:42px;font-weight:bold;color:#a94f36}</style><main><h1>🍑 英文多益考題</h1><small>每日 5 題 · Part 5 原創仿真練習</small><div id="app"></div></main><script>const bank=[{"s": "Please _____ the form before Friday.", "o": ["complete", "completes", "completed", "completion"], "a": 0, "t": "請在星期五前填妥表格。", "e": "祈使句使用原形動詞。", "n": ["原形動詞", "第三人稱單數", "過去式", "名詞"]}, {"s": "The meeting _____ at nine tomorrow.", "o": ["begin", "begins", "beginning", "begun"], "a": 1, "t": "會議明天九點開始。", "e": "固定行程可用現在簡單式，主詞為單數。", "n": ["原形", "單數動詞", "現在分詞", "過去分詞"]}, {"s": "She is responsible _____ training new staff.", "o": ["at", "on", "for", "by"], "a": 2, "t": "她負責訓練新員工。", "e": "be responsible for 為固定搭配。", "n": ["在", "在…上", "對…負責", "藉由"]}, {"s": "The package was _____ yesterday.", "o": ["deliver", "delivering", "delivery", "delivered"], "a": 3, "t": "包裹昨天已送達。", "e": "被動語態為 be 加過去分詞。", "n": ["原形", "現在分詞", "名詞", "過去分詞"]}, {"s": "Our office is _____ the second floor.", "o": ["on", "to", "from", "during"], "a": 0, "t": "我們的辦公室在二樓。", "e": "樓層使用介系詞 on。", "n": ["在樓層", "往", "從", "在期間"]}, {"s": "Please speak more _____ during the presentation.", "o": ["clear", "clearly", "clearness", "clearest"], "a": 1, "t": "簡報時請說得更清楚。", "e": "副詞修飾動詞 speak。", "n": ["形容詞", "副詞", "名詞", "最高級"]}, {"s": "We need _____ information about the product.", "o": ["many", "few", "more", "several"], "a": 2, "t": "我們需要更多產品資訊。", "e": "information 不可數，more 可修飾不可數名詞。", "n": ["修飾可數複數", "修飾可數複數", "更多", "修飾可數複數"]}, {"s": "If you have questions, _____ us.", "o": ["contacting", "contacted", "contacts", "contact"], "a": 3, "t": "如有問題，請聯絡我們。", "e": "主要子句為祈使句，使用原形動詞。", "n": ["現在分詞", "過去式", "單數動詞", "原形"]}, {"s": "The store will be closed _____ Monday.", "o": ["until", "among", "between", "into"], "a": 0, "t": "商店將休息至星期一。", "e": "until 表示持續至某時間。", "n": ["直到", "在多者之間", "在兩者之間", "進入"]}, {"s": "This machine is _____ than the old one.", "o": ["efficient", "more efficient", "most efficient", "efficiency"], "a": 1, "t": "這台機器比舊的更有效率。", "e": "than 搭配比較級。", "n": ["原級", "比較級", "最高級", "名詞"]}, {"s": "All employees must _____ their ID cards.", "o": ["wearing", "wore", "wear", "wears"], "a": 2, "t": "所有員工都必須佩戴識別證。", "e": "情態動詞 must 後接原形。", "n": ["現在分詞", "過去式", "原形", "單數動詞"]}, {"s": "Thank you for _____ our hotel.", "o": ["choose", "chose", "chosen", "choosing"], "a": 3, "t": "感謝您選擇我們的飯店。", "e": "介系詞 for 後接動名詞。", "n": ["原形", "過去式", "過去分詞", "動名詞"]}, {"s": "The manager has _____ the report.", "o": ["reviewed", "review", "reviews", "reviewing"], "a": 0, "t": "經理已審閱報告。", "e": "現在完成式 has 加過去分詞。", "n": ["過去分詞", "原形", "單數動詞", "現在分詞"]}, {"s": "The new printer is easy _____ use.", "o": ["for", "to", "with", "at"], "a": 1, "t": "新印表機很容易使用。", "e": "easy to 加原形動詞。", "n": ["為了", "不定詞標記", "與", "在"]}, {"s": "We canceled the trip _____ the heavy rain.", "o": ["although", "because", "because of", "unless"], "a": 2, "t": "因為大雨，我們取消旅行。", "e": "because of 後接名詞片語。", "n": ["雖然，接子句", "因為，接子句", "因為，接名詞", "除非，接子句"]}, {"s": "There _____ several chairs in the room.", "o": ["is", "be", "was", "are"], "a": 3, "t": "房間裡有幾張椅子。", "e": "there be 句型依後方複數名詞使用 are。", "n": ["單數現在", "原形", "單數過去", "複數現在"]}, {"s": "Please arrive _____ to prepare for the interview.", "o": ["early", "earlier than", "earliest than", "earliness"], "a": 0, "t": "請提早抵達以準備面試。", "e": "early 可作副詞修飾 arrive。", "n": ["提早", "比較結構不完整", "錯誤比較結構", "名詞"]}, {"s": "The company offers free _____ to customers.", "o": ["deliver", "delivery", "delivered", "delivering"], "a": 1, "t": "公司提供顧客免費配送。", "e": "形容詞 free 後需要名詞 delivery。", "n": ["動詞", "名詞", "過去分詞", "動名詞，非此固定用法"]}, {"s": "Mr. Lee is _____ for the sales position.", "o": ["apply", "applied", "applying", "application"], "a": 2, "t": "李先生正在申請銷售職位。", "e": "現在進行式 is 加現在分詞。", "n": ["原形", "過去式", "現在分詞", "名詞"]}, {"s": "You can pay _____ cash or by credit card.", "o": ["at", "on", "to", "in"], "a": 3, "t": "您可以付現或刷卡。", "e": "in cash 是固定搭配。", "n": ["在", "在…上", "往", "以現金"]}];let qs=[],ans=[],pos=0;const app=document.getElementById('app');let hist=[];try{hist=JSON.parse(localStorage.getItem('toeicHistory')||'[]');if(!Array.isArray(hist))hist=[]}catch(e){}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){qs=shuffle(bank).slice(0,5);ans=Array(5).fill(null);pos=0;render()}function render(){let q=qs[pos];app.innerHTML=`<article><small>第 ${pos+1} / 5 題 · 已答 ${ans.filter(x=>x!==null).length} 題</small><progress max="5" value="${ans.filter(x=>x!==null).length}"></progress><h2>${q.s}</h2>${q.o.map((o,i)=>`<button class="${ans[pos]===i?'sel':''}" aria-pressed="${ans[pos]===i}" onclick="pick(${i})">${'ABCD'[i]}. ${o}</button>`).join('')}<div class="row"><button onclick="move(-1)" ${pos===0?'disabled':''}>上一題</button><button onclick="move(1)" ${pos===4||ans[pos]===null?'disabled':''}>下一題</button></div><button class="primary" onclick="finish()" ${ans.includes(null)?'disabled':''}>交卷並查看解析</button></article><small>交卷前可修改答案。</small>`}function pick(i){ans[pos]=i;render()}function move(d){pos+=d;render()}function finish(){if(ans.includes(null))return;let score=qs.filter((q,i)=>q.a===ans[i]).length;hist.unshift({date:new Date().toLocaleString('zh-TW'),score});hist=hist.slice(0,30);let saved=true;try{localStorage.setItem('toeicHistory',JSON.stringify(hist))}catch(e){saved=false}app.innerHTML=`<article><small>練習完成！</small><div class="score">${score} / 5</div><p>正確率 ${score*20}%</p>${saved?'':'<p>瀏覽器無法儲存紀錄。</p>'}<button class="primary" onclick="start()">再練 5 題</button><button onclick="historyView()">查看練習紀錄</button></article><h2>錯題分析與答案</h2>${qs.map((q,i)=>`<article><strong class="${q.a===ans[i]?'good':'bad'}">第 ${i+1} 題 · ${q.a===ans[i]?'答對':'答錯'}</strong><p>${q.s}</p><p>中文：${q.t}</p><p>你的答案：${'ABCD'[ans[i]]}. ${q.o[ans[i]]}<br>正確答案：${'ABCD'[q.a]}. ${q.o[q.a]}</p><p><strong>文法解析：</strong>${q.e}</p>${q.o.map((o,j)=>`<p class="${j===q.a?'good':''}">${'ABCD'[j]}. ${o}：${q.n[j]}</p>`).join('')}</article>`).join('')}`;window.scrollTo(0,0)}function historyView(){app.innerHTML=`<article><h2>練習紀錄</h2>${hist.length?hist.map(h=>`<p>${h.date}　${h.score}/5</p>`).join(''):'<p>尚無紀錄</p>'}<button class="primary" onclick="start()">開始練習</button></article>`;window.scrollTo(0,0)}app.innerHTML='<article><h2>今天也學一點英文 🌱</h2><p>每次隨機抽出 5 題，完成後查看中文與文法解析。</p><small>內建 20 道原創題目，非官方歷屆試題。</small><button class="primary" onclick="start()">開始練習</button><button onclick="historyView()">練習紀錄</button></article>';</script></html>
